<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0d1936"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="glowGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Node Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.25"/>
      <circle cx="40" cy="40" r="1" fill="#475569" fill-opacity="0.4"/>
    </pattern>
  </defs>

  <style>
    .title-text {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #94a3b8;
    }
    .tagline-text {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 14px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      fill: #38bdf8;
    }
    .pill-text {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }

    /* Subtle Animated Elements */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.65; transform: scale(1.08); }
    }
    @keyframes floatOrb1 {
      0%, 100% { transform: translate(0px, 0px); }
      50% { transform: translate(-25px, 20px); }
    }
    @keyframes floatOrb2 {
      0%, 100% { transform: translate(0px, 0px); }
      50% { transform: translate(30px, -20px); }
    }
    @keyframes dashLine {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes wavePulse {
      0%, 100% { r: 6px; opacity: 0.8; }
      50% { r: 10px; opacity: 1; }
    }

    .orb-1 {
      animation: floatOrb1 12s ease-in-out infinite, pulseGlow 8s ease-in-out infinite;
      transform-origin: 200px 100px;
    }
    .orb-2 {
      animation: floatOrb2 15s ease-in-out infinite, pulseGlow 10s ease-in-out infinite;
      transform-origin: 1000px 300px;
    }
    .data-flow {
      stroke-dasharray: 8 6;
      animation: dashLine 20s linear infinite;
    }
    .ping-circle {
      animation: wavePulse 3s ease-in-out infinite;
    }
  </style>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="url(#bgGrad)"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Dynamic Glowing Orbs (in background) -->
  <g>
    <circle class="orb-1" cx="180" cy="110" r="180" fill="url(#glowGrad1)"/>
    <circle class="orb-2" cx="1020" cy="280" r="220" fill="url(#glowGrad2)"/>
  </g>

  <!-- Decorative Pipeline & Relationship Network (Behind Foreground Content) -->
  <g opacity="0.45">
    <path class="data-flow" d="M 80 80 Q 220 30, 380 90 T 700 80 T 1120 120" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <path class="data-flow" d="M 80 340 Q 300 390, 560 330 T 940 350 T 1120 300" fill="none" stroke="#a855f7" stroke-width="2"/>
    
    <!-- Connection Nodes with Pulsing Accent -->
    <circle cx="220" cy="58" r="5" fill="#38bdf8" filter="url(#glow)"/>
    <circle cx="700" cy="80" r="5" fill="#818cf8" filter="url(#glow)"/>
    <circle cx="1000" cy="108" r="6" fill="#c084fc" filter="url(#glow)"/>
    <circle class="ping-circle" cx="560" cy="330" r="7" fill="#ec4899" filter="url(#glow)"/>
    <circle cx="940" cy="350" r="5" fill="#38bdf8" filter="url(#glow)"/>
  </g>

  <!-- Foreground Content Container -->
  <g transform="translate(80, 0)">
    
    <!-- Category Pill Badge -->
    <g transform="translate(0, 68)">
      <rect width="330" height="32" rx="16" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6"/>
      <circle cx="16" cy="16" r="4.5" fill="#38bdf8" class="ping-circle"/>
      <text x="32" y="21" class="tagline-text">Curated CRM &amp; Relationship Hub</text>
    </g>

    <!-- Main Title -->
    <g transform="translate(0, 150)">
      <text class="title-text" fill="url(#primaryGrad)">
        Awesome Contact &amp; Account Management
      </text>
    </g>

    <!-- Subtitle -->
    <g transform="translate(0, 202)">
      <text class="subtitle-text">
        The definitive open-source &amp; SaaS ecosystem for sales pipelines, customer intelligence &amp; account tracking.
      </text>
    </g>

    <!-- Interactive / Dynamic Feature Badges in Foreground -->
    <g transform="translate(0, 260)">
      <!-- Pill 1: SaaS Leaders -->
      <g transform="translate(0, 0)">
        <rect width="180" height="42" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2"/>
        <text x="20" y="26" class="pill-text">🏢 SaaS Giants &amp; SMBs</text>
      </g>
      <!-- Pill 2: Open Source -->
      <g transform="translate(200, 0)">
        <rect width="200" height="42" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2"/>
        <text x="20" y="26" class="pill-text">⚡ Top Open-Source CRMs</text>
      </g>
      <!-- Pill 3: Pipeline Tracking -->
      <g transform="translate(420, 0)">
        <rect width="180" height="42" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2"/>
        <text x="20" y="26" class="pill-text">🎯 Sales Pipelines</text>
      </g>
      <!-- Pill 4: Pricing Transparency -->
      <g transform="translate(620, 0)">
        <rect width="190" height="42" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2"/>
        <text x="20" y="26" class="pill-text">💎 Transparent Pricing</text>
      </g>
      <!-- Pill 5: Market Intelligence -->
      <g transform="translate(830, 0)">
        <rect width="190" height="42" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2"/>
        <text x="20" y="26" class="pill-text">📊 Market Dynamics</text>
      </g>
    </g>

    <!-- Bottom Decorative Status Indicator -->
    <g transform="translate(0, 345)">
      <circle cx="6" cy="6" r="4" fill="#10b981"/>
      <text x="20" y="10" font-family="system-ui, sans-serif" font-size="12" fill="#64748b" font-weight="500">
        Continuous Community Curation • Star Verified • Updated Active Repos
      </text>
    </g>

  </g>
</svg>
